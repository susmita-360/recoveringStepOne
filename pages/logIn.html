<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="stylesheet" href="../style/logIn.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-header">
        
        <h1>ABCD SCHOOL</h1>
        
        <p>Your Gateway to Learning Excellence .</p>
      </div>
      <div class="loginMe">
        <form action="#">
          <div class="form-group">
            <input type="email" name="userName" placeholder="Email or Phone Number" />
          </div>
          <div class="form-group">
            <input type="password" name="userPswd" id="userPswd" placeholder="Password" />
          </div>
          <div class="form-group">
            <input type="button" value="Log In Me" class="btn" />
          </div>
          <div class="divider"></div>
          <div class="form-group">
            <input type="button" value="Create New Account" class="btn btn-create"  onclick="window.location.href='../testProject/register.html';" />
          </div>
        </form>
      </div>
    </div>
    <script src="../js/logIn.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="../style/register.css" />
</head>

<body>
  <div class="container">
    <div class="register-header">
      <h1>Sign Up</h1>
      <!-- <img src="../images/logo.png" alt="ABCD School Logo" class="logo" /> -->
      <p>It's quick and easy.</p>
    </div>
    <div class="register-form">
      <form action="#">
        <div class="form-group">
          <input type="text" name="firstName" placeholder="First name" required />
          <input type="text" name="Middle" placeholder="Middle name" required />
          <input type="text" name="lastName" placeholder="Last name" required />
          <input type="email" name="email" placeholder="Mobile number or email" required />
          <input type="password" name="password" placeholder="New password" required />
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" name="dob" id="dob" required />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <input type="radio" name="gender" id="male" value="male" required />
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female" required />
            <label for="female">Female</label>
            <input type="radio" name="gender" id="custom" value="custom" required />
            <label for="custom">Custom</label>
          </div>
        </div>
        <div class="form-group">
          <input type="submit" value="Sign Up" class="btn" />
        </div>
      </form>
    </div>
  </div>
</body>

</html>
